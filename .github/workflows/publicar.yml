name: Actualizar y publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Lunes 09:15, hora aproximada de Chile continental (12:15 UTC).
    - cron: "15 12 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar paquetes de R
        run: |
          Rscript -e 'install.packages(c("readxl", "mapgl", "rvest", "jsonlite", "stringr", "rmarkdown"), repos = "https://cloud.r-project.org")'

      - name: Actualizar noticias
        continue-on-error: true
        run: Rscript -e 'source("scripts/actualizar_noticias.R")'

      - name: Renderizar sitio Quarto
        run: quarto render

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio generado
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
